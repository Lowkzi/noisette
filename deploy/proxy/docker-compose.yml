services:
  caddy:
    image: caddy:2-alpine
    container_name: shared_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shared-proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  shared-proxy:
    external: true
