services:
  db:
    image: postgres:15-alpine
    container_name: noisette_db_prod
    restart: always
    environment:
      POSTGRES_USER: admin_noisette
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: noisette_prod
    volumes:
      - noisette_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_noisette"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - noisette-network

  app:
    image: ghcr.io/${GITHUB_USERNAME}/noisette:latest
    container_name: noisette_app
    restart: always
    environment:
      DATABASE_URL: "postgresql://admin_noisette:${DB_PASSWORD}@db:5432/noisette_prod?schema=public"
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_APP_URL: https://${MY_DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - noisette-network
      - shared-proxy

volumes:
  noisette_db_data:

networks:
  noisette-network:
    driver: bridge
  shared-proxy:
    external: true
